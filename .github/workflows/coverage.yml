name: Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-tarpaulin-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run tarpaulin
        run: cargo tarpaulin --out Html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tarpaulin-report.html

      - name: Check coverage threshold
        run: |
          cargo tarpaulin --message-format=json --out /dev/null 2> coverage.json
          COVERAGE=$(cat coverage.json | jq -r '.line_rate')
          echo "Line coverage: $COVERAGE"
          if (( $(echo "$COVERAGE < 0.3" | bc -l) )); then
            echo "Coverage is below threshold (30%)"
            exit 1
          fi
